name: uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      proba_alerta:
        description: "Pica intentionat, ca sa probezi emailul"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verifica Planova
        run: |
          fail=0
          check() {
            url="$1"; expect="$2"
            for i in 1 2 3; do
              body=$(curl -s --max-time 15 -w '\n%{http_code}' "$url") && code=$(echo "$body" | tail -n1) || code=000
              if [ "$code" = "200" ] && { [ -z "$expect" ] || echo "$body" | grep -q "$expect"; }; then
                echo "OK  $url"; return 0
              fi
              sleep 20
            done
            echo "::error::PICAT $url (cod $code)"; fail=1
          }
          check https://app.planova.ro/health-status '"status":"Healthy"'
          check https://default.app.planova.ro/health-status '"status":"Healthy"'
          check https://planova.ro/ ''
          if [ "${{ inputs.proba_alerta }}" = "true" ]; then echo "::error::PROBA de alerta (intentionat)"; fail=1; fi
          exit $fail
